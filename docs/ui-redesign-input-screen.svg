      <text x="52" y="16" class="muted small">CONTENT VOLUME</text><text x="52" y="42" class="ink h1">Distribution setup</text>
    </g>
    <g transform="translate(26 106)">
      <rect width="172" height="90" rx="14" class="cream"/><text x="18" y="34" class="muted small">START DATE</text><text x="18" y="65" class="ink h2">May 13</text>
      <rect x="192" width="172" height="90" rx="14" class="cream"/><text x="210" y="34" class="muted small">END DATE</text><text x="210" y="65" class="ink h2">May 31</text>
      <rect x="384" width="172" height="90" rx="14" class="cream"/><text x="402" y="34" class="muted small">TOTAL POSTS</text><text x="402" y="65" class="ink h2">20</text>
    </g>
