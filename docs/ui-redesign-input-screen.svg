      <rect y="22" width="580" height="64" rx="14" class="green"/><circle cx="28" cy="54" r="10" fill="#87936D"/><text x="52" y="49" class="ink h2">Auto spread across period</text><text x="52" y="72" class="muted body">20 posts across 19 days means mostly daily, with one skipped day.</text>
      <rect y="100" width="580" height="64" rx="14" class="surface"/><circle cx="28" cy="132" r="10" fill="#D4CEC3"/><text x="52" y="127" class="ink h2">Weekdays only</text><text x="52" y="150" class="muted body">Avoid weekends or manually block dates.</text>
      <rect y="178" width="580" height="64" rx="14" class="surface"/><circle cx="28" cy="210" r="10" fill="#D4CEC3"/><text x="52" y="205" class="ink h2">Manual density</text><text x="52" y="228" class="muted body">Set high-volume days, launch days, and quiet days.</text>
    </g>
    <g transform="translate(26 506)">
      <text class="muted small">PLATFORM RULE</text>
      <rect y="20" width="278" height="64" rx="14" class="blue"/><text x="20" y="52" class="ink h2">Same idea cross-posted</text><text x="20" y="74" class="muted body">TikTok + Instagram together</text>
      <rect x="302" y="20" width="278" height="64" rx="14" class="surface"/><text x="322" y="52" class="ink h2">Separate platform slots</text><text x="322" y="74" class="muted body">Counts each platform post</text>
    </g>
  </g>
  <g transform="translate(704 246)">
