      <rect x="362" y="92" width="270" height="36" rx="10" fill="#FFFCF7" stroke="#C8DDE4"/><text x="378" y="116" class="muted body">Reference image / folder URL</text>
      <rect x="362" y="144" width="128" height="36" rx="10" fill="#23211D"/><text x="390" y="168" fill="#fff" font-family="Inter,Arial" font-size="14" font-weight="700">Add asset</text>
    </g>
    <g transform="translate(26 370)">
      <rect width="652" height="206" rx="16" class="green"/>
      <text x="20" y="36" class="ink h2">Visual identity</text>
      <rect x="20" y="62" width="188" height="96" rx="14" fill="#FFFCF7" stroke="#CFDBC6"/><text x="38" y="96" class="muted small">FONTS</text><text x="38" y="126" class="ink h2">Arimo · GFS Didot</text>
      <rect x="232" y="62" width="188" height="96" rx="14" fill="#FFFCF7" stroke="#CFDBC6"/><text x="250" y="96" class="muted small">COLORS</text><circle cx="262" cy="126" r="12" fill="#FF4C16"/><circle cx="296" cy="126" r="12" fill="#F3F3F3" stroke="#ccc"/><circle cx="330" cy="126" r="12" fill="#F9F6F1" stroke="#ccc"/><circle cx="364" cy="126" r="12" fill="#000"/>
      <rect x="444" y="62" width="188" height="96" rx="14" fill="#FFFCF7" stroke="#CFDBC6"/><text x="462" y="96" class="muted small">LOGO / PRODUCT LINKS</text><text x="462" y="126" class="muted body">External only</text>
