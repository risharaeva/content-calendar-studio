    <text x="76" y="34" class="ink h2">Content Calendar Studio</text><text x="76" y="56" class="muted body">ILARIA workspace · shared database</text>
    <g transform="translate(510 15)">
      <rect width="134" height="44" rx="12" fill="#23211D"/><text x="42" y="28" fill="#FFFCF7" font-family="Inter,Arial" font-size="15" font-weight="700">Inputs</text>
      <rect x="148" width="194" height="44" rx="12" fill="#F3F0E9"/><text x="196" y="28" class="ink body" font-weight="700">Content Calendar</text>
      <rect x="356" width="142" height="44" rx="12" fill="#F3F0E9"/><text x="399" y="28" class="ink body" font-weight="700">Analytics</text>
    </g>
    <rect x="1154" y="17" width="190" height="40" rx="11" fill="#23211D"/><text x="1196" y="42" fill="#FFFCF7" font-family="Inter,Arial" font-size="15" font-weight="700">Create plan</text>
  </g>
  <g transform="translate(42 126)">
    <text class="ink h1" x="0" y="32">Inputs</text><text class="muted body" x="0" y="60">Project context, content volume, inspiration sources, and visual identity.</text>
    <g transform="translate(0 88)">
      <rect width="1356" height="56" rx="14" class="surface"/>
      <rect x="12" y="10" width="210" height="36" rx="10" fill="#23211D"/><text x="48" y="33" fill="#FFFCF7" font-family="Inter,Arial" font-size="14" font-weight="700">Plan setup</text>
      <rect x="234" y="10" width="230" height="36" rx="10" fill="#FFF0E8"/><text x="278" y="33" class="ink body" font-weight="700">Inspiration inbox</text>
      <rect x="476" y="10" width="230" height="36" rx="10" fill="#EEF6F8"/><text x="520" y="33" class="ink body" font-weight="700">Visual references</text>
      <rect x="718" y="10" width="210" height="36" rx="10" fill="#F1F6EE"/><text x="762" y="33" class="ink body" font-weight="700">Brand strategy</text>
      <text x="1118" y="34" class="muted body">Autosaves before generation</text><circle cx="1294" cy="28" r="8" fill="#38A169"/>
    </g>
  </g>
  <g transform="translate(42 246)">
