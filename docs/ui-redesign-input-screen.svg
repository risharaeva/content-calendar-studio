<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B17" flood-opacity=".10"/></filter>
    <style>
      .bg{fill:#F6F2EA}.surface{fill:#FFFCF7;stroke:#DED8CC}.cream{fill:#FFF5EB;stroke:#E8D1BF}.blue{fill:#EEF6F8;stroke:#C8DDE4}.green{fill:#F1F6EE;stroke:#CFDBC6}
      .ink{fill:#23211D;font-family:Inter,Arial,sans-serif}.muted{fill:#6F6A61;font-family:Inter,Arial,sans-serif}.h1{font:700 30px Inter,Arial}.h2{font:700 19px Inter,Arial}.body{font:15px Inter,Arial}.small{font:12px Inter,Arial;letter-spacing:1.1px}.btn{fill:#23211D}.orange{fill:#FF4C16}
    </style>
  </defs>
  <rect width="1440" height="980" class="bg"/>
  <g transform="translate(34 24)">
