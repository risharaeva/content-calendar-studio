<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1D1B18" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="headerBand" x1="0" y1="0" x2="1440" y2="120">
      <stop stop-color="#FFF7EE"/>
      <stop offset="0.48" stop-color="#F8FAF6"/>
      <stop offset="1" stop-color="#EEF4F7"/>
