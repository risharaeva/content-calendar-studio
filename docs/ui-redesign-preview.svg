      .panel-blue { fill: #EFF6F7; stroke: #CADFE5; stroke-width: 1; }
      .panel-green { fill: #F1F5EC; stroke: #D2DCC4; stroke-width: 1; }
      .ink { fill: #23211D; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #6F6A61; font-family: Inter, Arial, sans-serif; }
      .tiny { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; }
      .label { font-size: 13px; letter-spacing: .7px; text-transform: uppercase; }
      .body { font-size: 15px; }
      .h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
      .h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
      .h3 { font-size: 15px; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", Menlo, monospace; }
      .btn { fill: #24211D; }
      .btn2 { fill: #FFF7EE; stroke: #D7C9B8; stroke-width: 1; }
      .orange { fill: #FF4C16; }
      .sage { fill: #87936D; }
      .blue { fill: #416D84; }
      .line { stroke: #BDB6AA; stroke-width: 1; }
      .icon { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
